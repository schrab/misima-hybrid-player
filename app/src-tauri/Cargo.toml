[package]
name = "misima-player"
version = "0.1.0"
description = "Multiplatform skinnable music player"
authors = ["Misima"]
edition = "2021"

[lib]
name = "misima_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "ogg", "vorbis", "pcm"] }
cpal = "0.15"
rustfft = "6"
crossbeam-channel = "0.5"
parking_lot = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Dev without this: MP3 decode+resample takes ~30s (unoptimized).
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
