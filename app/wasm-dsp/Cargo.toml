[package]
name = "misima-wasm-dsp"
version = "0.3.2"
edition = "2021"
description = "Misima Hybrid DSP chain compiled to WASM for the AudioWorklet"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
rustfft = "6.2"

[profile.release]
# The worklet has a 128-sample budget per `process()` call, so the DSP must be
# fast and must not trip the 1 MB-per-function wasm32 stack probe.
opt-level = 3
lto = true
codegen-units = 1
