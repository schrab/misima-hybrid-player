<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/misima-gibrid-icon.svg" />
    <title>MI$IM∆ hybrid player</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="ui"></canvas>
    <!-- Load progress. A hairline across the top: the background plate alone is
         2.2 MB, so without this the page reads as broken rather than loading.
         Fades out once the skin is in. -->
    <div class="load-bar" id="load-bar"><span></span></div>
    <!-- Corner mark. The icon is drawn on a dark palette, so `styles.css`
         inverts it to read against the black page. Hidden on desktop. -->
    <img class="corner-logo" src="/misima-gibrid-icon.svg" alt="MI$IM∆ hybrid" />
    <!--
      Attribution for the bundled tracks. The music is Wit Chu's, used with his
      permission — link to the source rather than leaving a dead credit. Web
      only: the desktop build plays the user's own local files and ships no
      bundled track. `styles.css` hides this unless the page is the web build.
    -->
    <p class="credit">
      <a href="https://t.me/misimahybrid" target="_blank" rel="noopener noreferrer">misima telegram</a>
      <span class="sep">·</span>
      music ©&nbsp;<a href="https://witchu.bandcamp.com" target="_blank" rel="noopener noreferrer">Wit Chu</a>
    </p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
