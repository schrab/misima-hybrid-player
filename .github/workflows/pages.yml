name: Deploy web app

# Build the static browser build and publish it to GitHub Pages.
#
# Runs on every push to `main` and on manual dispatch. `release.yml` is
# untouched and still owns the desktop installers — this workflow only affects
# the Pages site.
#
# One-time setup (a human must do this, it is a repository setting):
#   Pages → Build and deployment → Source → GitHub Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let the newest finish.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Cheap and first: wasm-dsp `#[path]`-includes the desktop DSP sources, so
      # a wrong relative path is a compile error here. Checking before the
      # multi-minute wasm-pack install turns a late, confusing failure into an
      # immediate one.
      - name: Check the shared DSP compiles for wasm
        working-directory: app/wasm-dsp
        run: cargo check --target wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      # Builds the WASM DSP and the bundled worklet, then runs the full gate:
      # tsc -> tests -> vite build. A failing test fails the deploy.
      - name: Build site
        working-directory: app
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
