name: Release

# Build installers for all three platforms and attach them to a GitHub
# Release on the Releases page.
#
# Cut a release by pushing a tag that matches the app version
# (tauri.conf.json / package.json / Cargo.toml — all three places):
#
#   git tag v0.4.0 && git push origin v0.4.0
#
# The macOS build is a universal binary (one .dmg for Intel + Apple
# Silicon). The repo is public, so runner minutes are free and unlimited
# on the GitHub free plan — including macOS and Windows runners.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # System deps for Tauri 2 on Ubuntu 22.04 (webkit2gtk-4.1 line), plus
      # libasound2-dev — the audio core (CPAL/alsa-sys) links ALSA directly.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev zstd

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Node 24 (current LTS). Nothing in the toolchain is Node-20-bound —
          # vite 6, tsx and the Tauri CLI all run fine here — and the README's
          # "v20+" floor describes the oldest human machine, not CI. Keep CI on
          # the modern runtime; don't lower it to re-prove the floor.
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Misima Hybrid Player v__VERSION__"
          releaseBody: |
            Installers for Windows (.msi / .exe), macOS (.dmg, Intel + Apple Silicon in one) and Linux (.deb / .rpm / .AppImage / .pkg.tar.zst for Arch).

            The binaries are unsigned:
            - macOS: right-click the app and choose "Open" the first time, or allow it under System Settings > Privacy & Security.
            - Windows: if SmartScreen warns, click "More info" > "Run anyway".
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Arch has no native target in `tauri.conf.json` — the bundler emits deb,
      # rpm and AppImage, and none of them install with pacman. Worse, the
      # AppImage is actively broken there: it carries support libraries built on
      # ubuntu-22.04 that shadow the host's on a rolling distro, and the web
      # process aborts on startup (JavaScriptCore assertion) before a window
      # appears. The .deb does not have that problem — it bundles nothing and
      # declares webkit2gtk as a dependency, so the whole stack resolves to the
      # host's — so the Arch package is converted from the .deb.
      #
      # This was `debtap` until v0.4.2, the first tag it ever ran on, and it
      # failed immediately. debtap is written to run *on Arch*: it calls `pkgfile`
      # inside the conversion path (not just in `debtap -u`), refuses to start
      # without /var/cache/pkgfile and a set of /var/cache/debtap/* databases,
      # and calls `namcap`. None of that exists on ubuntu-22.04, so installing
      # anything would not have made it work.
      #
      # `scripts/deb2arch.py` writes .PKGINFO and .MTREE directly instead. The
      # deb→Arch name mapping is DEP_MAP at the top of that file; it fails loudly
      # on a dependency it does not know rather than guessing, because a wrong
      # name silently produces an uninstallable package. It then re-opens the
      # finished archive and checks it, since emitting a file is not the same as
      # emitting a valid one.
      #
      # continue-on-error on purpose: the Windows and macOS installers are
      # uploaded by the earlier tauri-action step, so a packaging fault here must
      # never mark the release red or withhold them. A missing Arch asset is
      # obvious on the Releases page; a red run that ships nothing is not.
      - name: Convert the deb into an Arch package
        if: matrix.platform == 'ubuntu-22.04'
        continue-on-error: true
        run: |
          set -euo pipefail

          deb=$(find app/src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          if [ -z "$deb" ]; then
            echo "::error::no .deb found — did the tauri build run?"
            exit 1
          fi
          echo "converting $deb"

          mkdir -p dist-arch
          python scripts/deb2arch.py "$deb" dist-arch

          pkg=$(find dist-arch -name '*.pkg.tar.zst' -print -quit)
          if [ -z "$pkg" ]; then
            echo "::error::deb2arch.py produced no package"
            exit 1
          fi
          python scripts/deb2arch.py --verify "$pkg"

      - name: Attach the Arch package to the release
        if: matrix.platform == 'ubuntu-22.04'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pkg=$(find dist-arch -name '*.pkg.tar.zst' -print -quit)
          if [ -z "$pkg" ]; then
            echo "::warning::no Arch package was built; nothing to attach"
            exit 0
          fi
          gh release upload "${{ github.ref_name }}" "$pkg" --clobber

